<body class="ambient-backdrop bg-grid-pattern project-details-page" data-page="project-details">

  <!-- Dedicated Case Study Reading Progress Indicator -->
  <div id="case-study-progress-track" class="case-study-progress-track" aria-hidden="false">
    <div
      id="case-study-progress-bar"
      class="case-study-progress-bar"
      role="progressbar"
      aria-label="Case study reading progress"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    ></div>
  </div>

  <header id="site-header"></header>

  <main id="main-content" tabindex="-1">
    <section class="section" id="projects-root">
      <div class="container space-y-8 sm:space-y-10">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <nav aria-label="Breadcrumb" class="flex flex-wrap items-center gap-2 text-xs sm:text-sm text-[var(--muted)]">
            <a href="index.html" class="hover:text-[var(--text)] transition-colors">Home</a>

          <a href="projects.html" class="outline-button text-xs py-1.5 px-3 min-h-[36px] no-print">

        </div>

        <div id="project-details-container" class="space-y-10 sm:space-y-12">
          <h1 class="hero-title">Project Case Study</h1>
        </div>
      </div>
    </section>
  </main>

  <!-- Enhanced Image Lightbox Modal (Zoom + Touch Swipe + Keyboard Nav) -->
  <div
    id="project-lightbox"
    class="lightbox-backdrop"
    role="dialog"
    aria-modal="true"
    aria-label="Project gallery image viewer"
    aria-hidden="true"
  >
    <div class="lightbox-panel p-4 sm:p-6 space-y-4">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <p id="lightbox-caption" class="text-sm font-semibold text-[var(--text)] truncate"></p>
          <p id="lightbox-counter" class="text-xs font-mono-tech text-[var(--muted)] tabular-nums"></p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button
            type="button"
            id="lightbox-zoom-toggle"
            class="outline-button text-xs py-1.5 px-3 min-h-[38px]"
            aria-label="Toggle image zoom"
            aria-pressed="false"
          >
            <i data-lucide="zoom-in" class="w-4 h-4"></i>
            <span id="lightbox-zoom-label">Zoom</span>
          </button>
          <button type="button" id="lightbox-close" class="icon-button" aria-label="Close image viewer">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <div id="lightbox-viewport" class="lightbox-zoom-viewport">
        <img
          id="lightbox-image"
          src="assets/images/projects/astrapulse.jpg"
          alt="Project preview"
          class="lightbox-zoom-img"
        >
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3">
        <button type="button" id="lightbox-prev" class="secondary-button text-xs sm:text-sm py-2 px-4 min-h-[40px]">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
          <span>Previous</span>
        </button>
        <p class="hidden sm:block text-xs text-[var(--muted)]">
          Use <kbd class="font-mono-tech px-1.5 py-0.5 rounded border border-[var(--border)]">←</kbd> / <kbd class="font-mono-tech px-1.5 py-0.5 rounded border border-[var(--border)]">→</kbd>, swipe, or click image to zoom
        </p>
        <button type="button" id="lightbox-next" class="secondary-button text-xs sm:text-sm py-2 px-4 min-h-[40px]">
          <span>Next</span>
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
