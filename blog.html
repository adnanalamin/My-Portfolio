<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engineering Blog &amp; Technical Notes — AL AMIN</title>
  <meta name="description" content="Read technical articles on JavaScript, React, Node.js, MERN architecture, AI pipelines, web performance, and software career growth by AL AMIN.">
  <meta name="keywords" content="Software Engineering Blog, JavaScript Articles, React Guides, Node.js REST API, MERN Architecture, AI Engineering, AL AMIN">
  <meta name="author" content="AL AMIN">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://example.com/blog.html">
  <meta property="og:title" content="Engineering Blog &amp; Technical Notes — AL AMIN">
  <meta property="og:description" content="Engineering articles covering JavaScript, React, Node.js, MERN stack architecture, AI pipelines, and career craft.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AL AMIN Portfolio">
  <meta property="og:url" content="https://example.com/blog.html">
  <meta property="og:image" content="assets/images/blog/mern-architecture.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Engineering Blog &amp; Technical Notes — AL AMIN">
  <meta name="twitter:description" content="Deep dives into JavaScript, React, Node.js, MERN systems, AI, and web performance.">
  <meta name="twitter:image" content="assets/images/blog/mern-architecture.jpg">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "AL AMIN Engineering Blog",
    "url": "https://example.com/blog.html",
    "description": "Technical articles and software architecture notes by AL AMIN.",
    "author": {
      "@type": "Person",
      "name": "AL AMIN"
    }
  }
  </script>

  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#050816">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    };
  </script>
  <script defer src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body class="ambient-backdrop bg-grid-pattern">
  <a href="#main-content" class="skip-to-content">Skip to main content</a>
  <header id="site-header"></header>

  <main id="main-content" tabindex="-1">
    <section class="section" id="blog-index-root">
      <div class="container space-y-10 sm:space-y-12">
        <div class="space-y-5">
          <nav aria-label="Breadcrumb" class="flex items-center gap-2 text-xs sm:text-sm text-[var(--muted)]">
            <a href="index.html" class="hover:text-[var(--text)] transition-colors">Home</a>
            <span aria-hidden="true">/</span>
            <span class="text-[var(--text-secondary)]">Blog</span>
          </nav>

          <div class="space-y-4 animate-fade-in-up">
            <span class="badge">Editorial &amp; Engineering Notes</span>
            <h1 class="hero-title">
              Writing on <span class="gradient-text">Full-Stack Craft</span>
            </h1>
            <p class="section-subtitle">
              Practical deep dives across JavaScript, React, Node.js, MERN systems, AI pipelines, web performance, and software engineering career growth.
            </p>
          </div>
        </div>

        <!-- Featured Article -->
        <section aria-label="Featured article" id="blog-featured-mount" class="animate-fade-in-up delay-100"></section>

        <!-- Search & Category Controls -->
        <div id="blog-articles-anchor" class="space-y-4 pt-2 reveal">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-center">
            <div class="lg:col-span-8">
              <div id="blog-filter-tabs" class="skill-tabs-bar"></div>
            </div>

            <div class="lg:col-span-4">
              <div class="project-search-wrap">
                <i data-lucide="search" class="w-4 h-4 text-[var(--muted)] absolute left-3.5 pointer-events-none"></i>
                <label for="blog-search-input" class="sr-only">Search articles by title, category, tags, or content</label>
                <input
                  id="blog-search-input"
                  type="search"
                  class="project-search-input"
                  placeholder="Search title, tags, topics..."
                  autocomplete="off"
                >
                <button
                  type="button"
                  id="blog-search-clear"
                  class="hidden absolute right-2 w-8 h-8 rounded-md inline-flex items-center justify-center text-[var(--muted)] hover:text-[var(--text)]"
                  aria-label="Clear article search"
                >
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-3">
            <p id="blog-results-count" class="text-xs sm:text-sm font-mono-tech text-[var(--muted)] tabular-nums"></p>
            <div id="blog-active-tag-banner" class="hidden"></div>
          </div>
        </div>

        <!-- Responsive Article Grid: 1 col mobile / 2 col tablet / 3 col desktop -->
        <div id="blog-articles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Pagination -->
        <div id="blog-pagination"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script defer src="js/config.js"></script>
  <script defer src="js/theme.js"></script>
  <script defer src="js/brand.js"></script>
  <script defer src="js/modes.js"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/animations.js"></script>
  <script defer src="js/blog.js"></script>
  <script defer src="js/assistant.js"></script>
  <script defer src="js/ux.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
