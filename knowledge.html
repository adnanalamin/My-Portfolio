<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Knowledge Base — AL AMIN</title>
  <meta name="description" content="Personal software engineering knowledge base by AL AMIN covering JavaScript, React, Node.js, MongoDB, CSS, Security, UI/UX, AI, Career, and Development Notes.">
  <meta name="keywords" content="Engineering Knowledge Base, Developer Notes, JavaScript, React, Node.js, MongoDB, CSS, Security, UI/UX, AL AMIN">
  <meta name="author" content="AL AMIN">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://example.com/knowledge.html">
  <meta property="og:title" content="Personal Knowledge Base — AL AMIN">
  <meta property="og:description" content="Structured technical articles, development notes, tags, related guides, and reading progress across full-stack engineering.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AL AMIN Portfolio">
  <meta property="og:url" content="https://example.com/knowledge.html">
  <meta property="og:image" content="assets/images/projects/portfolio-system.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Personal Knowledge Base — AL AMIN">
  <meta name="twitter:description" content="Searchable developer handbook with categories, tags, articles, development notes, and reading progress.">
  <meta name="twitter:image" content="assets/images/projects/portfolio-system.jpg">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Personal Knowledge Base — AL AMIN",
    "description": "Searchable developer knowledge base spanning JavaScript, React, Node.js, MongoDB, CSS, Web Development, Security, UI/UX, AI, Career, and Development Notes.",
    "url": "https://example.com/knowledge.html"
  }
  </script>

  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#050816">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    };
  </script>
  <script defer src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/knowledge.css">
</head>
<body class="ambient-backdrop bg-grid-pattern">
  <div class="kb-progress-track" aria-hidden="true">
    <div id="kb-reading-progress-fill" class="kb-progress-fill"></div>
  </div>

  <a href="#main-content" class="skip-to-content">Skip to main content</a>
  <header id="site-header"></header>

  <main id="main-content" tabindex="-1">
    <section class="section" id="knowledge-base-root">
      <div class="container space-y-7 sm:space-y-9">
        <!-- Header -->
        <div class="space-y-4">
          <nav aria-label="Breadcrumb" class="flex items-center gap-2 text-xs sm:text-sm text-[var(--muted)]">
            <a href="index.html" class="hover:text-[var(--text)] transition-colors">Home</a>
            <span aria-hidden="true">/</span>
            <a href="blog.html" class="hover:text-[var(--text)] transition-colors">Blog</a>
            <span aria-hidden="true">/</span>
            <span class="text-[var(--text-secondary)]">Knowledge Base</span>
          </nav>

          <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 animate-fade-in-up">
            <div class="space-y-2.5 max-w-3xl">
              <div class="flex flex-wrap items-center gap-2 text-xs text-[var(--muted)]">
                <span class="font-semibold text-cyan-400">Personal Engineering Handbook</span>
                <span aria-hidden="true">·</span>
                <span id="kb-overall-progress" class="font-mono-tech tabular-nums text-[var(--text-secondary)]">0 / 0 read</span>
                <span aria-hidden="true">·</span>
                <span id="kb-scroll-progress-label" class="font-mono-tech tabular-nums">0% scrolled</span>
              </div>
              <h1 class="hero-title">Personal <span class="gradient-text">Knowledge Base</span></h1>
              <p class="section-subtitle">
                Curated engineering articles, architecture checklists, and development notes rendered dynamically from <span class="font-mono-tech text-[var(--text-secondary)]">knowledge.js</span>.
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5 shrink-0">
              <button type="button" id="kb-reset-btn" class="outline-button text-xs sm:text-sm min-h-[42px]">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                <span>Reset Filters</span>
              </button>
              <a href="blog.html" class="secondary-button text-xs sm:text-sm min-h-[42px]">
                <i data-lucide="book-open" class="w-4 h-4"></i>
                <span>Blog Archive</span>
              </a>
            </div>
          </div>
        </div>

        <!-- Search, Entry Type, Categories & Tag Filter Controls -->
        <section class="kb-toolbar animate-fade-in-up delay-100" aria-label="Search and filter knowledge base">
          <div class="flex flex-col lg:flex-row lg:items-center gap-3">
            <div class="kb-search-wrap flex-1">
              <i data-lucide="search" class="w-4 h-4 text-cyan-400 shrink-0" aria-hidden="true"></i>
              <label for="kb-search-input" class="sr-only">Search articles, notes, categories, and tags</label>
              <input
                type="search"
                id="kb-search-input"
                class="kb-search-input"
                placeholder="Search topics, code patterns, hooks, indexes, security, or #tags... (Press / to focus)"
                autocomplete="off"
              >
              <button
                type="button"
                id="kb-search-clear"
                class="hidden icon-button w-8 h-8 shrink-0"
                aria-label="Clear search query"
              >
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>

            <div id="kb-type-tabs" class="kb-filter-strip shrink-0" role="tablist" aria-label="Filter by entry format"></div>
          </div>

          <div class="space-y-1.5">
            <p class="text-xs font-semibold text-[var(--text-secondary)]">Categories</p>
            <div id="kb-category-bar" class="kb-filter-strip" role="tablist" aria-label="Knowledge base categories"></div>
          </div>

          <div class="space-y-1.5 border-t border-[var(--border)] pt-3">
            <div class="flex items-center justify-between gap-2">
              <p class="text-xs font-semibold text-[var(--text-secondary)]">Tags</p>
              <p id="kb-results-count" class="text-xs font-mono-tech tabular-nums text-[var(--muted)]"></p>
            </div>
            <div id="kb-tag-bar" class="kb-filter-strip" role="group" aria-label="Filter by topic tags"></div>
          </div>
        </section>

        <!-- Split Workspace: Catalog List + Reader Pane (Mounted cleanly from js/knowledge.js) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <div class="lg:col-span-5">
            <div id="kb-entries-list" class="kb-list-shell" aria-label="Knowledge base entries"></div>
          </div>

          <div class="lg:col-span-7">
            <article id="kb-reader-pane" class="kb-reader-shell" aria-live="polite"></article>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script defer src="js/config.js"></script>
  <script defer src="js/theme.js"></script>
  <script defer src="js/brand.js"></script>
  <script defer src="js/modes.js"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/animations.js"></script>
  <script defer src="js/knowledge.js"></script>
  <script defer src="js/assistant.js"></script>
  <script defer src="js/ux.js"></script>
  <script defer src="js/cache.js"></script>
  <script defer src="js/supabase-client.js"></script>
  <script defer src="js/data-service.js"></script>
  <script defer src="js/section-renderer.js"></script>
  <script defer src="js/content-loader.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
