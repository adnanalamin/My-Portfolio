      <div class="container space-y-6 sm:space-y-8">

        <div class="lr-panel grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3 items-center">
          <div class="lg:col-span-5">
            <label for="lr-search" class="sr-only">Search roadmap tracks</label>
            <input id="lr-search" type="search" class="lr-input w-full" placeholder="Search technology, objective, or project...">

          <div class="lg:col-span-3">

              <option value="Full-Stack">Full-Stack</option>
              <option value="Backend">Backend</option>
              <option value="Database">Database</option>
              <option value="DevOps / Tools">DevOps / Tools</option>
            </select>
          </div>
          <div class="lg:col-span-2">
            <label for="lr-status-filter" class="sr-only">Filter by status</label>
            <select id="lr-status-filter" class="lr-select w-full">
              <option value="All">All Statuses</option>
              <option value="Completed">Completed</option>
              <option value="Active">Active</option>
              <option value="Planned">Planned</option>
              <option value="Exploring">Exploring</option>
            </select>
          </div>
          <div class="lg:col-span-2 flex justify-end">
            <button type="button" id="lr-reset" class="outline-button text-xs py-2 px-3.5 min-h-[42px] w-full sm:w-auto">Reset</button>
          </div>
        </div>

        <p id="lr-count" class="text-xs font-mono-tech text-[var(--muted)]"></p>

        <!-- Vertical Roadmap + Detail Inspector -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <div class="lg:col-span-7">
            <div id="lr-timeline" class="lr-timeline"></div>
          </div>
          <aside class="lg:col-span-5 lr-panel lg:sticky lg:top-24" aria-label="Selected roadmap item details">
            <div id="lr-detail-panel"></div>
